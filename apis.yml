aid: skyryse
name: Skyryse
description: 'Skyryse is an El Segundo, California aviation technology company founded
  in 2016 by Mark Groden and Mitch Adler that builds SkyOS, a universal operating system
  for flight. SkyOS is a retrofittable hardware and software stack that replaces complex
  mechanical flight controls with a triply redundant, software-driven system, letting
  a pilot fly an airplane or helicopter with a single control stick and touchscreens.
  The platform delivers simplified flight controls, inherent stability, automated maneuvers,
  emergency autorotation, automated zero-visibility landing, envelope protection, and
  optionally piloted capability. Skyryse also produces Skyryse One, a SkyOS-powered production
  helicopter, and Skylar, a universal AI flight assistant. Customers and partners span
  the U.S. military, law enforcement, Cal Fire, emergency medical services, disaster
  response, and private operators. In February 2026 the company raised over $300 million
  in Series C funding at a $1.15 billion post-money valuation, co-led by Autopilot and
  Fidelity Investments. Skyryse operates as a certified-avionics and aircraft manufacturer
  and does not publish a public developer API, SDK, or developer portal.'
